[package]
name = "csv-nose"
version = "1.2.0"
edition = "2024"
authors = ["Joel Natividad <joel@datHere.com>"]
description = "CSV dialect sniffer using Garcia's Table Uniformity Method"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jqnatividad/csv-nose"
keywords = ["csv", "sniffer", "dialect", "detection"]
categories = ["command-line-utilities", "parsing", "text-processing"]
# Allowlist rather than a denylist: an `exclude` shipped local tooling
# (.claude/, .serena/, CLAUDE.md) to crates.io because anything not named was
# published by default. Note `tests/data/` is intentionally absent — the
# benchmark corpora are large, third-party, and not redistributable here;
# `tests/benchmark_accuracy.rs` skips when they are missing.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "docs/*.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "csv_nose"
path = "src/lib.rs"

[[bin]]
name = "csv-nose"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["clap"]
http = ["ureq"]
runtime-dispatch-simd = ["bytecount/runtime-dispatch-simd"]
generic-simd = ["bytecount/generic-simd"]

[dependencies]
csv = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
regex = "1"
simdutf8 = "0.1"
thiserror = "2.0"
bytecount = "0.6"
chardetng = "1"
encoding_rs = "0.8"
ureq = { version = "3", optional = true }
foldhash = "0.2"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
